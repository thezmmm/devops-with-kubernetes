apiVersion: v1
kind: Service
metadata:
  name: ping-pong-db
  namespace: exercises
spec:
  clusterIP: None
  selector:
    app: ping-pong-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ping-pong-db
  namespace: exercises
spec:
  serviceName: ping-pong-db
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-db
  template:
    metadata:
      labels:
        app: ping-pong-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "pingpong"
            - name: POSTGRES_USER
              value: "pingpong"
            - name: POSTGRES_PASSWORD
              value: "pingpong-password"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
