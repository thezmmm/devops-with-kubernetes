apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: TODO_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: TODO_DB_URL
            - name: TODO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: todo-backend-secret
                  key: TODO_DB_USER
            - name: TODO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-backend-secret
                  key: TODO_DB_PASSWORD
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: NATS_URL
            - name: NATS_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: NATS_SUBJECT
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
