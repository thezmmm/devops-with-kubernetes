apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: todo-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: TODO_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: TODO_DB_URL
            - name: TODO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: todo-backend-secret
                  key: TODO_DB_USER
            - name: TODO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-backend-secret
                  key: TODO_DB_PASSWORD
          ports:
            - containerPort: 8080
