apiVersion: v1
kind: ConfigMap
metadata:
  name: broadcaster-config
  namespace: staging
data:
  NATS_URL: "nats://nats.staging.svc.cluster.local:4222"
  NATS_SUBJECT: "todo.events"
  BROADCAST_MODE: "log-only"
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: staging
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10.25-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: broadcaster:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: broadcaster-config
                  key: NATS_URL
            - name: NATS_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: broadcaster-config
                  key: NATS_SUBJECT
            - name: BROADCAST_MODE
              valueFrom:
                configMapKeyRef:
                  name: broadcaster-config
                  key: BROADCAST_MODE
