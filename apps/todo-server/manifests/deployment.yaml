apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-server
  template:
    metadata:
      labels:
        app: todo-server
    spec:
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
      containers:
        - name: todo-server
          image: todo-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: IMAGE_CACHE_DIR
              value: "/data/images"
            - name: TODO_BACKEND_URL
              value: "http://todo-backend"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shared-data
              mountPath: /data
