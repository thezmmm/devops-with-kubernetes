apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output
  namespace: exercises
spec:
  ingressClassName: traefik
  rules:
    - host: log-output.local
      http:
        paths:
          - path: /pingpong
            pathType: Prefix
            backend:
              service:
                name: ping-pong
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-output
                port:
                  number: 80
