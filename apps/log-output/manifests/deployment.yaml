apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: log-config
          configMap:
            name: log-output-config
      containers:
        - name: logger
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          command: ["java", "-jar", "/app/log-output.jar", "writer"]
          env:
            - name: LOG_FILE_PATH
              value: "/data/log-output.txt"
            - name: LOG_INFO_FILE_PATH
              value: "/etc/config/information.txt"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-data
              mountPath: /data
            - name: log-config
              mountPath: /etc/config
              readOnly: true
        - name: reader
          image: log-output:latest
          imagePullPolicy: IfNotPresent
          command: ["java", "-jar", "/app/log-output.jar", "reader"]
          env:
            - name: PORT
              value: "8080"
            - name: LOG_FILE_PATH
              value: "/data/log-output.txt"
            - name: PING_PONG_URL
              value: "http://ping-pong/pingpong"
            - name: LOG_INFO_FILE_PATH
              value: "/etc/config/information.txt"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shared-data
              mountPath: /data
            - name: log-config
              mountPath: /etc/config
              readOnly: true
