name: Project GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'apps/todo-backend/**'
      - 'apps/todo-server/**'
      - '.github/workflows/project-gitops.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push todo-backend image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/todo-backend:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/todo-backend/Dockerfile apps/todo-backend
          docker push "$IMAGE"

      - name: Build and push todo-server image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/todo-server:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/todo-server/Dockerfile apps/todo-server
          docker push "$IMAGE"

      - name: Update backend and server image references in the GitOps manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          backend = Path('apps/todo-backend/manifests/deployment.yaml')
          server = Path('apps/todo-server/manifests/deployment.yaml')
          sha = '${{ github.sha }}'
          owner = '${{ github.repository_owner }}'
          for path in [backend, server]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('image: todo-backend:latest', f'image: ghcr.io/{owner}/todo-backend:{sha}')
              text = text.replace('image: todo-server:latest', f'image: ghcr.io/{owner}/todo-server:{sha}')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/todo-backend/manifests/deployment.yaml apps/todo-server/manifests/deployment.yaml
          git diff --cached --quiet || git commit -m "Update project images to ${{ github.sha }}"

      - name: Push manifest changes
        run: git push origin HEAD:${{ github.ref_name }}
