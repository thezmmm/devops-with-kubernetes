name: Log Output GitOps

on:
  push:
    branches:
      - main
    paths:
      - 'apps/log-output/**'
      - '.github/workflows/log-output-gitops.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push log-output image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/log-output:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/log-output/Dockerfile apps/log-output
          docker push "$IMAGE"

      - name: Update deployment image in the GitOps manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/log-output/manifests/deployment.yaml')
          text = path.read_text(encoding='utf-8')
          image = f"ghcr.io/${{ github.repository_owner }}/log-output:${{ github.sha }}"
          updated = text.replace('ghcr.io/thezmmm/log-output:latest', image)
          if updated == text:
              raise SystemExit('Expected image placeholder not found in deployment.yaml')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/log-output/manifests/deployment.yaml
          git diff --cached --quiet || git commit -m "Update log-output image to ${{ github.sha }}"

      - name: Push manifest changes
        run: git push origin HEAD:${{ github.ref_name }}
