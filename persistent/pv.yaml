apiVersion: v1
kind: PersistentVolume
metadata:
  name: project-shared-persistent-volume
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /tmp/project-shared-kubernetes-data
    type: DirectoryOrCreate
